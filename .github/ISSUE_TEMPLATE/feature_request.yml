name: Feature request
description: Suggest a formatting rule, configuration option, or behavior change
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: What problem does this solve?
      description: Describe the situation that prompted the request. Real examples beat abstract arguments.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should hdlfmtr do? Include a before-and-after VHDL example if possible.
      render: vhdl
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options you weighed and why they didn't fit.
  - type: checkboxes
    id: checks
    attributes:
      label: Compatibility
      options:
        - label: I have checked that this isn't already on the README roadmap.
        - label: I have searched existing issues for duplicates.
